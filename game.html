<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Game</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="assets/style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🎮%3C/text%3E%3C/svg%3E">
</head>
<body data-page="game">
  <div id="site-header"></div>
  <main id="main">
    <div class="wrap">
      <section class="game-hero">
        <img id="g-cover" alt="" onerror="this.style.visibility='hidden'">
        <div>
          <div class="crumbs"><a href="./#games">Games</a> / <span id="g-crumb"></span></div>
          <h1 id="g-name">&nbsp;</h1>
          <p id="g-tagline"></p>
          <p class="muted" id="g-count" style="margin-top:6px;font-size:14px"></p>
        </div>
      </section>

      <div class="tabs" id="tabs">
        <button class="on" data-tab="guides">Guides</button>
        <button data-tab="map">Map</button>
      </div>

      <section id="panel-guides">
        <div class="toolbar">
          <div class="chips" id="type-chips"></div>
          <input id="g-search" class="search" type="search" placeholder="Search this game…" aria-label="Search this game">
          <select id="g-sort" aria-label="Sort">
            <option value="order">Story order</option>
            <option value="newest">Newest</option>
            <option value="az">A–Z</option>
          </select>
        </div>
        <div id="guide-list"></div>
      </section>

      <section id="panel-map" class="hidden">
        <div class="map-legend">
          <select id="map-select" class="chip" aria-label="Choose map"></select>
          <span class="muted" id="map-count"></span>
          <span class="muted" style="margin-left:auto;font-size:13px">Click a pin to open its guide</span>
        </div>
        <div class="map-box" id="map-box"></div>
      </section>
    </div>
  </main>
  <div id="site-footer"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
