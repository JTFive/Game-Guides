<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0d1117; color: #e7edf3; font: 16px/1.5 system-ui, sans-serif; text-align: center; padding: 16px; }
    a { display: inline-block; margin-top: 12px; background: #5ec8f2; color: #06202c; padding: 10px 16px; border-radius: 10px; font-weight: 600; text-decoration: none; }
    p { color: #93a1b1; }
  </style>
</head>
<body>
  <div>
    <h1>Page not found</h1>
    <p>That page doesn't exist.</p>
    <a id="home" href="/">Back to all games</a>
  </div>
  <script>
    // Works whether the site lives at username.github.io/ or username.github.io/repo-name/
    var seg = location.pathname.split("/").filter(Boolean)[0];
    if (location.hostname.endsWith("github.io") && seg && !location.hostname.startsWith(seg)) document.getElementById("home").href = "/" + seg + "/";
  </script>
</body>
</html>
